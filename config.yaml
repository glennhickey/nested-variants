# config.yaml — Default configuration for local chr20 testing
# Override any value via config.local.yaml or on the command line:
#   snakemake --config ref=CHM13 vg='...' all

# Reference name (used by vg paths -Q; deconstruct/call use augref_<ref> automatically)
ref: GRCh38

# Input VG file(s) — glob patterns accepted (quoted)
vg: data/chr20.vg

# Output directory and naming prefix
out_dir: output
out_name: chr20.nested

# Minimum augmented-reference fragment length
min_augref_len: 50

# Minimum contig length for surjection/DeepVariant (0 = no filtering)
min_surject_len: 1000

# Minimum contig length for vcfeval/aardvark comparison (0 = use all eval contigs)
min_vcfeval_len: 0

# VCF comparison tool: "vcfeval" (rtg) or "aardvark"
eval_tool: aardvark

# Deconstruct options
cluster: ""
snarls: ""
star_allele: false

# BED file for reference gap overlay on plots (optional, empty = none)
refgaps_bed: ""

# Annotation BED files for overlap analysis (optional, empty = skip)
annot_genes: ""
annot_repeats: ""
annot_segdups: ""
annot_censat: ""
annot_pclai: ""
giab_strat: ""   # prefix for GIAB partition BEDs ({prefix}-easy.bed, -segdup.bed, -otherdifficult.bed)

# Pantree VCF for side-by-side comparison (optional, empty = skip)
pantree_vcf: ""

# Scale type for density plots: log1p, sqrt, log, identity
scale_type: log1p

# DeepVariant Docker image version
dv_version: "1.9.0"

# FreeBayes minimum QUAL for vcfeval comparisons (applied during pre-filtering, not to raw VCF)
freebayes_min_qual: 20

# FreeBayes extra args for long-read samples (cap coverage to avoid blowups on HiFi)
freebayes_longread_args: "--limit-coverage 100"

# FreeBayes extra args for short-read samples (empty = defaults)
freebayes_extra_args: ""

# FreeBayes Docker image
freebayes_docker: "staphb/freebayes:1.3.7"

# Set to true to run FreeBayes on long-read samples (default: false;
# FreeBayes is slow and unreliable on HiFi in complex regions).
# enable_freebayes_longread: false

# vcfeval Docker image for haplotype-aware VCF comparison
# Leave empty to use rtg directly (must be on PATH); set to use Docker instead
vcfeval_docker: ""

# Samples (optional — only needed for genotype/deepvariant rules)
# Each entry maps sample name → reads index file path
samples: {}
#  HG002: data/HG002.reads.idx
#  NA12878: data/NA12878.reads.idx

# Alternatively, provide a TSV file with columns: sample, reads_index
# samples_tsv: samples.tsv

# Long-read samples (optional — uses vg giraffe -b hifi preset)
# Same format as samples; outputs are kept separate from short-read samples.
longread_samples: {}
#  HG002-hifi: data/HG002.hifi.reads.idx

# Resource configuration
# Each rule has built-in defaults (see table below). Set global overrides to
# apply the same value to all rules, or per-rule overrides for fine control.
# Priority: {rule}_cpus > cpus > built-in default
# cpus: 8               # global CPU override for all rules
# mem_gb: 200           # global memory (GB) override for all rules
runtime_min: 2880       # 48 hours
partition: long

# Per-rule resource overrides (uncomment to customize)
# Rule defaults when not set: paths=128/512, deconstruct=128/512, haplotypes=128/512,
# giraffe=128/512, surject=128/512, call=128/512, deepvariant=128/512, fasta=128/512,
# vcfeval=16/128
# paths_cpus: 128
# paths_mem_gb: 512
# deconstruct_cpus: 128
# deconstruct_mem_gb: 512
# haplotypes_cpus: 128
# haplotypes_mem_gb: 512
# giraffe_cpus: 128
# giraffe_mem_gb: 512
# surject_cpus: 128
# surject_mem_gb: 512
# call_cpus: 128
# call_mem_gb: 512
# deepvariant_cpus: 128
# deepvariant_mem_gb: 512
# fasta_cpus: 128
# fasta_mem_gb: 512
