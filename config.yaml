# config.yaml — Default configuration for local chr20 testing
# Override any value via config.local.yaml or on the command line:
#   snakemake --config ref=CHM13 vg='...' all

# Reference name (used by vg paths -Q; deconstruct/call use augref_<ref> automatically)
ref: GRCh38

# Input VG file(s) — glob patterns accepted (quoted)
vg: data/chr20.vg

# Output directory and naming prefix
out_dir: output
out_name: chr20.nested

# Minimum augmented-reference fragment length
min_augref_len: 50

# Deconstruct options
cluster: ""
snarls: ""
star_allele: false

# BED file for reference gap overlay on plots (optional, empty = none)
refgaps_bed: ""

# Annotation BED files for overlap analysis (optional, empty = skip)
annot_genes: ""
annot_repeats: ""
annot_segdups: ""
annot_censat: ""

# Scale type for density plots: log1p, sqrt, log, identity
scale_type: log1p

# DeepVariant Docker image version
dv_version: "1.9.0"

# Samples (optional — only needed for genotype/deepvariant rules)
# Each entry maps sample name → reads index file path
samples: {}
#  HG002: data/HG002.reads.idx
#  NA12878: data/NA12878.reads.idx

# Alternatively, provide a TSV file with columns: sample, reads_index
# samples_tsv: samples.tsv

# Resource configuration
# Each rule has built-in defaults (see table below). Set global overrides to
# apply the same value to all rules, or per-rule overrides for fine control.
# Priority: {rule}_cpus > cpus > built-in default
# cpus: 8               # global CPU override for all rules
# mem_gb: 200           # global memory (GB) override for all rules
runtime_min: 960        # 16 hours
partition: long

# Per-rule resource overrides (uncomment to customize)
# Rule defaults when not set: paths=128/512, deconstruct=128/512, haplotypes=128/512,
# giraffe=128/512, surject=128/512, call=128/512, deepvariant=128/512, fasta=128/512
# paths_cpus: 128
# paths_mem_gb: 512
# deconstruct_cpus: 128
# deconstruct_mem_gb: 512
# haplotypes_cpus: 128
# haplotypes_mem_gb: 512
# giraffe_cpus: 128
# giraffe_mem_gb: 512
# surject_cpus: 128
# surject_mem_gb: 512
# call_cpus: 128
# call_mem_gb: 512
# deepvariant_cpus: 128
# deepvariant_mem_gb: 512
# fasta_cpus: 128
# fasta_mem_gb: 512
