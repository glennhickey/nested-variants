# Snakemake SLURM profile
# Usage: snakemake --profile profiles/slurm all
executor: slurm
default-resources:
  slurm_partition: long
  runtime: 960
  mem_mb: 32000
  # Node-local scratch for temp files (DeepVariant intermediates, samtools sort, etc).
  # IMPORTANT: Snakemake defaults tmpdir to /tmp, which is often too small for
  # DeepVariant. Set this to node-local scratch if your cluster has it:
  tmpdir: /data/tmp
  slurm_extra: "'--exclude=phoenix-08'"
jobs: 10000
